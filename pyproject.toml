[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vorlabs-anchor"
version = "0.1.0"
description = "Asynchronous node coordination via hand-offs, orders, and rings"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Vorlabs" }]
keywords = ["agents", "coordination", "blackboard", "orchestration", "workflow", "p2p"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]

# Core is stdlib-only on purpose.
dependencies = []

[project.optional-dependencies]
http = ["fastapi>=0.110", "uvicorn>=0.27"]
drift = ["vorlabs-drift>=0.4.0"]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/becksanswerr/anchor"
Documentation = "https://github.com/becksanswerr/anchor#readme"
Issues = "https://github.com/becksanswerr/anchor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]
